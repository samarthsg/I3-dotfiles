console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true
    
  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    background = 'transparent'
    foreground = '#89b4fa'
    template = '{{ .Path }}'
 
    [blocks.segments.properties]
        style = 'full'
  
  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    foregorund = '#6c6c6c'
    background = 'transparent'
    template = ' {{ .HEAD }}{{if or (.Working.Changed) (.Staging.Changed) }}*{{end}} <cyan>{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}</>'
    
    [blocks.segments.properties]
        commit_icon = '@' 
        fetch_status = true

[[blocks]]
    type = 'rprompt'
    overflow = 'hidden'
    
    [[blocks.segments]]
        type = 'executiontime'
        style = 'plain'
        foregorund = '#f9e2af'
        background = 'transparent'
        template = '{{ .FormattedMs }}'
        
        [blocks.segments.properties]
            threshold = 5000
            
[[blocks]]
    type = 'prompt'
    alignment = 'left'
    newline = true


  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground_templates = [
        "{{if gt .Code 0}}#f38ba8{{end}}",
        "{{if eq .Code 0}}#c6a0f6{{end}}",
    ]
    background = 'transparent'
    template = '❯'

[transient_prompt]
  foreground_templates = [
      "{{if gt .Code 0}}#f38ba8{{end}}",
      "{{if eq .Code 0}}#c6a0f6{{end}}",
  ]
  background = 'transparent'
  template = '❯ '

[secondary_prompt]
    foreground = '#c6a0f6'
    background = 'transparent'
    template = '❯❯ '
